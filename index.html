<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>ONEIROS</title>
<style>
body{margin:0;background:#0a0a1a;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}
canvas{background:#111;display:block;cursor:pointer}
#ui{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);text-align:center}
#ui.hidden{display:none}
#hud{position:absolute;top:10px;left:10px;right:10px;display:none;justify-content:space-between;color:#fff;font-size:14px}
#hud.active{display:flex}
.bar{height:8px;background:#222;border-radius:4px;margin-top:2px}
.bar-fill{height:100%;border-radius:4px;transition:width .2s}
.hf{background:#c01030}
.xf{background:#188018}
.btn{background:#4a2080;color:#fff;border:none;padding:12px 40px;font-size:16px;border-radius:6px;cursor:pointer}
.btn:hover{background:#6a30a0}
</style></head><body>
<canvas id="c" width="960" height="540"></canvas>
<div id="hud">
<div>
<div style="width:150px">
<div class="bg">HP <span id="hp">100</span></div>
<div class="bar"><div class="bar-fill hf" id="hp-bar" style="width:100%"></div></div>
<div class="bg" style="margin-top:4px">XP <span id="xp">0</span></div>
<div class="bar"><div class="bar-fill xf" id="xp-bar" style="width:0%"></div></div>
</div>
</div>
<div style="text-align:right;font-size:12px;color:#aaa">
<div id="lvl">NIVEL 1</div>
<div>KILLS <span id="kills">0</span></div>
</div>
</div>
<div id="ui">
<div style="font-size:32px;color:#9060d0;margin-bottom:8px">ONEIROS</div>
<div style="font-size:12px;color:#555;margin-bottom:20px">El Sueno de los Agentes Vivos</div>
<button class="btn" id="bplay">JUGAR</button>
<div style="margin-top:12px;font-size:10px;color:#444">WASD mover | Click atacar | Space dodge</div>
</div>
<script>
(function(){
var c=document.getElementById("c"),x=c.getContext("2d");
var G={state:"menu"};
var P={x:480,y:270,hp:100,mhp:100,xp:0,lvl:1,aT:0,dT:0,inv:0,kills:0};
var E=[];
var K={};

document.getElementById("bplay").addEventListener("click",function(){
  document.getElementById("ui").classList.add("hidden");
  document.getElementById("hud").classList.add("active");
  G.state="playing";
  E=[];
  for(var i=0;i<10;i++){
    E.push({x:Math.random()*900+30,y:Math.random()*500+20,hp:30,mhp:30,atk:5,spd:1.5,c:"rgb("+Math.floor(Math.random()*200+50)+",50,50)",sz:12,aT:Math.random()*30});
  }
  P.hp=P.mhp;P.x=480;P.y=270;P.inv=30;
  c.onclick=attack;
});

function attack(){
  if(P.aT>0||P.dT>0)return;
  P.aT=20;
  for(var i=0;i<E.length;i++){
    var e=E[i];
    var d=Math.sqrt((P.x-e.x)*(P.x-e.x)+(P.y-e.y)*(P.y-e.y));
    if(d<50+this.aTwX){
      e.hp-=15;e.vx=(e.x-P.x)*3;e.vy=(e.y-P.y)*3;
      if(e.hp<=0){E.splice(i,1);P.kills++;P.xp+=15;i--;if(P.xp>=100){P.lvl++;P.xp=0;P.mhp+=10;P.hp=P.mhp;}}
    }
  }
}

document.addEventListener("keydown",function(e){K[e.key]=true;});
document.addEventListener("keyup",function(e){K[e.key]=false;});

function update(){
  if(G.state!=="playing")return;
  if(K["w"]||K["ArrowUp"])P.y-=4;
  if(K["s"]||K["ArrowDown"])P.y+=4;
  if(K["a"]||K["ArrowLeft"])P.x-=4;
  if(K["d"]||K["ArrowRight"])P.x+=4;
  P.x=Math.max(15,Math.min(945,P.x));
  P.y=Math.max(15,Math.min(525,P.y));
  if(P.aT>0)P.aT--;
  if(P.dT>0)P.dT--;
  if(P.inv>0)P.inv--;
  if(K[" "]&&P.dT<=0){P.dT=10;P.inv=10;}
  for(var i=0;i<E.length;i++){
    var e=E[i];
    var d=Math.sqrt((P.x-e.x)*(P.x-e.x)+(P.y-e.y)*(P.y-e.y));
    if(d<250){var a=Math.atan2(P.y-e.y,P.x-e.x);e.x+=Math.cos(a)*e.spd;e.y+=Math.sin(a)*e.spd;}
    if(d<20&&P.inv<=0)P.hp-=e.atk;
    e.vx*=0.9;e.vy*=0.9;e.x+=e.vx;e.y+=e.vy;
  }
  if(E.length<5)E.push({x:Math.random()*900+30,y:Math.random()*500+20,hp:30,mhp:30,atk:5,spd:1.5,c:"rgb(200,50,50)",sz:12,aT:Math.random()*30});
  if(P.hp<=0){P.hp=P.mhp;P.x=480;P.y=270;E=[];for(var i=0;i<10;i++)E.push({x:Math.random()*900+30,y:Math.random()*500+20,hp:30,mhp:30,atk:5,spd:1.5,c:"rgb(200,50,50)",sz:12,aT:Math.random()*30});}
}

function render(){
  x.fillStyle="#0a0a1a";x.fillRect(0,0,960,540);
  x.strokeStyle="#1a1a30";
  for(var gx=0;gx<960;gx+=40){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,540);x.stroke();}
  for(var gy=0;gy<540;gy+=40){x.beginPath();x.moveTo(0,gy);x.lineTo(960,gy);x.stroke();}
  for(var i=0;i<E.length;i++){var e=E[i];x.fillStyle=e.c;x.beginPath();x.arc(e.x,e.y,e.sz,0,6.28);x.fill();x.fillStyle="#fff";x.fillRect(e.x-2,e.y-2,4,4);}
  x.fillStyle="#4090e0";x.beginPath();x.arc(P.x,P.y,10,0,6.28);x.fill();x.fillStyle="#fff";x.fillRect(P.x-2,P.y-2,4,4);
}

function hud(){document.getElementById("hp").textContent=Math.ceil(P.hp);document.getElementById("hp-bar").style.width=(P.hp/P.mhp*100)+"%";document.getElementById("xp").textContent=P.xp;document.getElementById("xp-bar").style.width=P.xp+"%";document.getElementById("lvl").textContent="NIVEL "+P.lvl;document.getElementById("kills").textContent=P.kills;}

function loop(){update();render();hud();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script></body></html>
