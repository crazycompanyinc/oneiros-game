<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>ONEIROS</title>
<style>
body{margin:0;background:#0a0a1a;color:#ddd;font-family:system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden}
canvas{display:block;background:#111;border:1px solid #333}
#hud{position:absolute;top:10px;left:10px;font-size:12px;color:#aaa}
</style></head><body>
<canvas id="c" width="800" height="600"></canvas>
<div id="hud">HP: <span id="hp">100</span> | XP: <span id="xp">0</span> | LVL: <span id="lvl">1</span></div>
<script>
var c=document.getElementById("c"),x=c.getContext("2d");
var W=800,H=600;
var G={state:"play",cam:{x:0,y:0}};
var P={x:1000,y:1000,hp:100,mhp:100,xp:0,lvl:1,xp2:100,atk:10,def:2,spd:3,cd:0};
var E=[];
var keys={};
var particles=[];

// Generate world
var world=[];
for(var i=0;i<60;i++){world.push({x:Math.random()*2000,y:Math.random()*2000,w:20+Math.random()*40,h:20+Math.random()*40});}

// Spawn enemies
for(var i=0;i<15;i++){
  E.push({x:Math.random()*2000,y:Math.random()*2000,hp:30,mhp:30,atk:5,spd:1.5,c:[200,50,50],sz:12,alive:true});
}

document.addEventListener("keydown",function(e){keys[e.code]=true;});
document.addEventListener("keyup",function(e){keys[e.code]=false;});
c.addEventListener("mousedown",function(){if(P.cd<=0){P.cd=0.3;attack();}});

function attack(){
  for(var i=0;i<E.length;i++){
    var e=E[i];if(!e.alive)continue;
    var d=Math.sqrt((P.x-e.x)*(P.x-e.x)+(P.y-e.y)*(P.y-e.y));
    if(d<50){e.hp-=P.atk+Math.floor(Math.random()*5);e.vx=(e.x-P.x)*3;e.vy=(e.y-P.y)*3;particles.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,l:1,c:[255,100,100]});if(e.hp<=0){e.alive=false;P.xp+=15;document.getElementById("xp").textContent=P.xp;if(P.xp>=P.xp2){P.lvl++;P.xp=0;P.xp2=Math.floor(P.xp2*1.3);P.atk+=3;P.mhp+=10;P.hp=P.mhp;document.getElementById("lvl").textContent=P.lvl;}}}}
}

function update(dt){
  // Player movement
  var mx=0,my=0;
  if(keys["KeyW"])my-=1;if(keys["KeyS"])my+=1;
  if(keys["KeyA"])mx-=1;if(keys["KeyD"])mx+=1;
  if(mx||my){var len=Math.sqrt(mx*mx+my*my);P.x+=(mx/len)*P.spd;P.y+=(my/len)*P.spd;}
  P.x=Math.max(20,Math.min(1980,P.x));P.y=Math.max(20,Math.min(1980,P.y));
  if(P.cd>0)P.cd-=dt;
  
  // Camera
  G.cam.x=P.x-W/2;G.cam.y=P.y-H/2;
  
  // Enemies
  for(var i=0;i<E.length;i++){
    var e=E[i];if(!e.alive)continue;
    var d=Math.sqrt((P.x-e.x)*(P.x-e.x)+(P.y-e.y)*(P.y-e.y));
    if(d<300){var a=Math.atan2(P.y-e.y,P.x-e.x);e.x+=Math.cos(a)*e.spd;e.y+=Math.sin(a)*e.spd;}
    if(d<25){P.hp-=e.atk*dt;document.getElementById("hp").textContent=Math.ceil(P.hp);if(P.hp<=0){P.hp=P.mhp;P.x=1000;P.y=1000;}}
    e.vx*=0.9;e.vy*=0.9;e.x+=e.vx;e.y+=e.vy;
  }
  
  // Particles
  for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.l-=dt;if(p.l<=0){particles.splice(i,1);continue}p.x+=p.vx;p.y+=p.vy;}
}

function render(){
  x.fillStyle="#111";x.fillRect(0,0,W,H);
  var cam=G.cam;
  
  // World objects
  x.fillStyle="#222";
  for(var i=0;i<world.length;i++){var w=world[i];x.fillRect(w.x-cam.x,w.y-cam.y,w.w,w.h);}
  
  // Enemies
  for(var i=0;i<E.length;i++){var e=E[i];if(!e.alive)continue;
    x.fillStyle="rgb("+e.c.join(",")+")";x.beginPath();x.arc(e.x-cam.x,e.y-cam.y,e.sz,0,Math.PI*2);x.fill();
    x.fillStyle="#fff";x.fillRect(e.x-cam.x-2,e.y-cam.y-2,4,4);
  }
  
  // Player
  x.fillStyle="#4af";x.beginPath();x.arc(P.x-cam.x,P.y-cam.y,10,0,Math.PI*2);x.fill();
  x.fillStyle="#fff";x.fillRect(P.x-cam.x-2,P.y-cam.y-2,4,4);
  
  // Particles
  for(var i=0;i<particles.length;i++){var p=particles[i];x.fillStyle="rgba("+p.c.join(",")+","+p.l+")";x.fillRect(p.x-cam.x-2,p.y-cam.y-2,4,4);}
  
  // Attack cooldown indicator
  if(P.cd>0){x.fillStyle="rgba(255,200,50,0.5)";x.fillRect(10,H-20,50*(P.cd/0.3),5);}
}

var lt=0;
function loop(ts){
  var dt=Math.min((ts-lt)/1000,0.05);lt=ts;
  update(dt);render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
